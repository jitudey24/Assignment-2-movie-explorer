<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0f172a"/>

  <!-- Clapperboard body -->
  <rect x="10" y="26" width="44" height="28" rx="4" fill="#ec4899"/>

  <!-- Clapperboard top bar (striped) -->
  <g>
    <rect x="8" y="12" width="48" height="12" rx="3" fill="#0f172a" stroke="#ec4899" stroke-width="2" transform="rotate(-8 32 18)"/>
    <!-- diagonal stripes -->
    <g transform="rotate(-8 32 18)" clip-path="url(#stripeClip)">
      <rect x="8" y="12" width="48" height="12" fill="#0f172a"/>
      <path d="M14 12 L20 24 M22 12 L28 24 M30 12 L36 24 M38 12 L44 24 M46 12 L52 24" stroke="#ec4899" stroke-width="3"/>
    </g>
  </g>

  <!-- Center circle accent -->
  <circle cx="32" cy="40" r="7" fill="#0f172a"/>
  <circle cx="32" cy="40" r="7" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.5"/>

  <defs>
    <clipPath id="stripeClip">
      <rect x="8" y="12" width="48" height="12" rx="3"/>
    </clipPath>
  </defs>
</svg>
